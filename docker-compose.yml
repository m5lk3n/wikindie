services:
  wikindie:
    build: .
    # Matches the host user by default so the bind-mounted ./space volume stays
    # writable without a manual chown. Override with your own UID/GID if needed.
    user: "${UID:-1000}:${GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "3000:3000"
    environment:
      WIKINDIE_USER: "${WIKINDIE_USER:?Set WIKINDIE_USER in .env or your shell}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env or your shell}"
      SPACE_DIR: /space
    volumes:
      - ./space:/space
